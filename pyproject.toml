[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glance"
version = "1.0.0"
description = "Glance AI Beauty Consultant domain models and service contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0"
]
data = [
    "dvc>=3.50",
    "dvc-s3>=3.0"
]

[tool.setuptools.packages.find]
where = ["src"]
